<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>4399 扫码登录</title>
    <link rel="stylesheet" href="css/loading.css">
</head>
<body>
    <div class="qr-card">
        <h2>4399 扫码登录</h2>
        <p class="tip">请使用手机 4399 App 扫描下方二维码</p>

        <div class="qr-box">
            <img id="qrImage" alt="二维码" width="200" height="200">
            <div class="qr-mask" id="qrMask" hidden>二维码已过期，请点击刷新</div>
        </div>

        <p class="status" id="status">正在获取二维码...</p>

        <div class="actions">
            <button type="button" id="refresh">刷新二维码</button>
            <button type="button" id="Logining" disabled>扫码后点击登录</button>
        </div>
    </div>

    <script src="js/loading.js"></script>
</body>
</html>
